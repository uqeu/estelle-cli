# GitHub secret scanning — path exclusions.
#
# Schema: https://docs.github.com/en/code-security/secret-scanning/using-advanced-secret-scanning-and-push-protection-features/excluding-folders-and-files-from-secret-scanning
# Top-level key is `paths-ignore`; entries use GitHub Actions glob syntax; max 1,000 entries;
# the file itself must stay under 1 MB. It applies to BOTH alerts and push protection, which is
# the half that matters here — without it, regenerating the rule set is blocked at the push.
#
# WHY THIS ONE PATH:
#
# `estelle-client/secret_rules.json` is the gitleaks rule catalogue (219 rules), generated by
# `scripts/generate_secret_rules.py` from gitleaks' own `config/gitleaks.toml` and embedded into
# the binary by `estelle-client/src/secret_engine.rs:51` (`include_str!`). It is DATA FOR A
# DETECTOR, not configuration: nothing in this repository reads a value out of it and uses it as
# a credential.
#
# Each rule carries an `allowlist` array — the values our own scanner must NOT flag, because
# upstream publishes them as documentation examples. On 2026-08-30 GitHub's scanner opened 16
# "Google API Key" alerts against lines 845-860 of that file: the entire `allowlist` of the
# `gcp-api-key` rule, one of which is the `AIza` prefix followed by the lower-case alphabet and
# `1234567`. GitHub flagged our secret scanner's list of known-fake keys. Nothing to rotate.
#
# The values are NOT repeated in this comment, deliberately: the test named below asserts that no
# allowlisted value appears anywhere outside the rule set, and quoting one here would make this
# file the counter-example to its own justification.
#
# The file must NOT be hand-edited to silence this (its own header says so, and it is checked by
# `scripts/test-secret-rules-are-detector-data.py`): deleting the allowlist would make Estelle's
# detector fire on gitleaks' own published examples on every customer repository that quotes
# them — strictly worse than the alert it would silence.
#
# `scripts/test-secret-rules-are-detector-data.py` proves the exclusion is safe by asserting that
# no allowlisted value appears anywhere in this repository except inside that file's own
# `allowlist` arrays. If one ever does, that test fails and this exclusion stops being defensible.
paths-ignore:
  - "estelle-client/secret_rules.json"

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The audit proves that its recorded checkpoint is an ancestor of the release tag.
          fetch-depth: 0
      - name: Require an exact Cargo SemVer tag
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}
          grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' <<<"$tag"
          version=$(awk '
            /^\[workspace.package\]$/ { in_package=1; next }
            /^\[/ { in_package=0 }
            in_package && /^version = / { gsub(/[" ]/, "", $3); print $3; exit }
          ' Cargo.toml)
          test "$tag" = "v$version"
          shim_version=$(node -p "require('./npm-shim/package.json').version")
          test "$tag" = "v$shim_version"
          # The plugin door states the version twice more. Four writers of one derived fact is how
          # the manifest sat at 0.1.0 while the CLI shipped 0.2.20 — caught only because this check
          # was extended to look. A tag may not disagree with any of them.
          plugin_version=$(node -p "require('./estelle-plugin/.claude-plugin/plugin.json').version")
          test "$tag" = "v$plugin_version"
          market_version=$(node -p "require('./.claude-plugin/marketplace.json').plugins[0].version")
          test "$tag" = "v$market_version"
      - name: Prove the plugin door's identity and version agreement
        run: python3 scripts/test-plugin-identity.py
      - name: Prove checksum-first installer behavior
        run: ./scripts/test-installer.sh
      - name: Prove release archives are byte-reproducible
        run: ./scripts/test-release-package.sh
      - name: Prove the shipped IP-boundary guard
        run: python3 scripts/test-ip-boundary.py
      - name: Prove the public-binary receipt harness
        run: python3 scripts/test-public-binary-receipts.py
      - name: Prove the public INSTALL receipt harness
        run: python3 scripts/test-public-install-receipts.py
      - name: Verify fork provenance and egress census
        shell: bash
        run: |
          set -euo pipefail
          base=582569998181aad08a88bacc151a94b2048a5d1f
          git fetch --no-tags --depth=1 https://github.com/openai/codex.git "$base"
          python3 scripts/check-fork-audit.py
      - name: Gate the shipped Rust surfaces
        env:
          # libtest workers default to 2 MiB; the largest measured full-App fixture needs between 5 and
          # 6 MiB. Keep an explicit bounded 8 MiB test stack, matching a conventional process main stack.
          RUST_MIN_STACK: "8388608"
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked -p estelle-client -p estelle-tui --all-targets -- -D warnings
          cargo test --locked -p estelle-client -p estelle-tui

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            file_marker: "Mach-O 64-bit executable arm64"
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            file_marker: "Mach-O 64-bit executable x86_64"
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            file_marker: "x86-64"
          # GitHub's standard ARM runner keeps target-native OpenSSL and other C dependencies native too.
          # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            file_marker: "ARM aarch64"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Build locked release binary
        shell: bash
        env:
          RUSTFLAGS: -D warnings
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          test "$host" = "${{ matrix.target }}"
          cargo build --locked --release --package estelle-tui --bin estelle --target "${{ matrix.target }}"
          binary="target/${{ matrix.target }}/release/estelle"
          test -x "$binary"
          python3 scripts/check-ip-boundary.py "$binary"
          description=$(file "$binary")
          grep -F -- "${{ matrix.file_marker }}" <<<"$description"
          test "$("$binary" --version)" = "estelle ${GITHUB_REF_NAME#v}"
          ESTELLE_TEST_BINARY="$binary" \
            ESTELLE_TEST_TARGET="${{ matrix.target }}" \
            ESTELLE_TEST_EXPECTED_OUTPUT="estelle ${GITHUB_REF_NAME#v}" \
            ./scripts/test-installer.sh
          mkdir dist
          install -m 0755 "$binary" "dist/estelle-${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: estelle-${{ matrix.target }}
          path: dist/estelle-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Build reproducible archives and checksum manifest
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name 'estelle-*' | wc -l)" -eq 4
          ./scripts/package-release.sh dist release
          cp install.sh release/install.sh
          cp fork-manifest.yaml docs/egress-sinks.toml release/
          sha256sum fork-manifest.yaml > release/FORK-MANIFEST.sha256
      - name: Sign build provenance for every downloadable artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/*
      - name: Publish versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Estelle CLI ${GITHUB_REF_NAME}

          Install the latest release:

              curl --proto '=https' --tlsv1.2 -fsSL \
                https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sh

          The installer verifies SHA256SUMS before installing. Verify GitHub's signed provenance separately:

              gh attestation verify estelle-<target>.tar.gz --repo ${GITHUB_REPOSITORY}

          Public-binary surface receipts (published after a fresh-runner install and production probe):

              https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/public-binary-receipts.json

          Public INSTALL receipts on real TypeScript, Go, and mixed repositories:

              https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/public-install-receipts.json
          EOF
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag --title "Estelle CLI $GITHUB_REF_NAME" --notes-file release-notes.md

  public-binary-receipts:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the exact release from its public URL
        env:
          ESTELLE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh" | sh
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
      - name: Clone a real public repository
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/Shubhamsaboo/awesome-llm-apps.git \
            "${RUNNER_TEMP}/awesome-llm-apps"
          lockfile="${RUNNER_TEMP}/awesome-llm-apps/rag_tutorials/multimodal_agentic_rag/frontend/package-lock.json"
          reindex_source="${RUNNER_TEMP}/awesome-llm-apps/mcp_ai_agents/ai_travel_planner_mcp_agent_team/app.py"
          test -f "$lockfile"
          test -f "$reindex_source"
          printf '\n' >> "$lockfile"
          printf '\n# Estelle public receipt reindex marker.\n' >> "$reindex_source"
          if git -C "${RUNNER_TEMP}/awesome-llm-apps" diff --quiet -- \
            rag_tutorials/multimodal_agentic_rag/frontend/package-lock.json; then
            echo "public receipt: lockfile fixture did not produce a measured diff" >&2
            exit 1
          fi
          if git -C "${RUNNER_TEMP}/awesome-llm-apps" diff --quiet -- \
            mcp_ai_agents/ai_travel_planner_mcp_agent_team/app.py; then
            echo "public receipt: source fixture did not produce a measured diff" >&2
            exit 1
          fi
      - name: Drive all 24 read surfaces through bare estelle
        id: public_receipts
        continue-on-error: true
        working-directory: ${{ runner.temp }}/awesome-llm-apps
        env:
          ESTELLE_API_KEY: ${{ secrets.ESTELLE_RECEIPT_API_KEY }}
          ESTELLE_RECEIPT_PATH: ${{ runner.temp }}/public-http-receipts.jsonl
        run: |
          set -euo pipefail
          test -n "${ESTELLE_API_KEY:-}" || {
            echo "public receipt: ESTELLE_RECEIPT_API_KEY is absent on ${GITHUB_REPOSITORY}" >&2
            exit 1
          }
          test "$(command -v estelle)" = "${HOME}/.local/bin/estelle"
          python3 "${GITHUB_WORKSPACE}/scripts/public-binary-receipts.py" \
            --expected-version "${GITHUB_REF_NAME}" \
            --repo Shubhamsaboo/awesome-llm-apps \
            --output "${RUNNER_TEMP}/public-binary-receipts.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: public-binary-receipts-${{ github.ref_name }}
          path: ${{ runner.temp }}/public-binary-receipts.json
          if-no-files-found: error
      - name: Attach the exact receipt to the public release
        if: steps.public_receipts.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            "${RUNNER_TEMP}/public-binary-receipts.json" --clobber
      - name: Fail closed after preserving the receipt
        if: always() && steps.public_receipts.outcome != 'success'
        run: |
          echo "public receipt: one or more installed-binary contracts failed; inspect the uploaded receipt" >&2
          exit 1

  public-install-receipts:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the exact release from its public URL
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh" | sh
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
      - name: Clone real TypeScript, Go, and mixed repositories
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/Shubhamsaboo/awesome-llm-apps.git \
            "${RUNNER_TEMP}/typescript"
          git clone --depth=1 https://github.com/google/go-cmp.git \
            "${RUNNER_TEMP}/go"
          git clone --depth=1 --filter=blob:limit=500k https://github.com/coder/coder.git \
            "${RUNNER_TEMP}/mixed"
          test "$(git -C "${RUNNER_TEMP}/typescript" ls-files '*.ts' '*.tsx' | wc -l)" -gt 0
          test "$(git -C "${RUNNER_TEMP}/go" ls-files '*.go' | wc -l)" -gt 0
          test "$(git -C "${RUNNER_TEMP}/mixed" ls-files '*.ts' '*.tsx' | wc -l)" -gt 0
          test "$(git -C "${RUNNER_TEMP}/mixed" ls-files '*.go' | wc -l)" -gt 0
      - name: Drive INSTALL through the installed public binary and production
        id: install_receipts
        continue-on-error: true
        env:
          ESTELLE_API_KEY: ${{ secrets.ESTELLE_RECEIPT_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${ESTELLE_API_KEY:-}" || {
            echo "INSTALL receipt: ESTELLE_RECEIPT_API_KEY is absent on ${GITHUB_REPOSITORY}" >&2
            exit 1
          }
          test "$(command -v estelle)" = "${HOME}/.local/bin/estelle"
          python3 scripts/public-install-receipts.py \
            --binary "${HOME}/.local/bin/estelle" \
            --expected-version "${GITHUB_REF_NAME}" \
            --typescript "${RUNNER_TEMP}/typescript" \
            --go "${RUNNER_TEMP}/go" \
            --mixed "${RUNNER_TEMP}/mixed" \
            --trace-dir "${RUNNER_TEMP}/install-traces" \
            --output "${RUNNER_TEMP}/public-install-receipts.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: public-install-receipts-${{ github.ref_name }}
          path: ${{ runner.temp }}/public-install-receipts.json
          if-no-files-found: error
      - name: Attach the exact INSTALL receipt to the public release
        if: steps.install_receipts.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            "${RUNNER_TEMP}/public-install-receipts.json" --clobber
      - name: Fail closed after preserving the INSTALL receipt
        if: always() && steps.install_receipts.outcome != 'success'
        run: |
          echo "INSTALL receipt: one or more installed-binary contracts failed; inspect the uploaded receipt" >&2
          exit 1

  publish-npm-shim:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Use a pinned npm with trusted-publishing support
        run: npm install --global npm@11.9.0 --ignore-scripts
      - name: Prove the compatibility launcher
        run: npm test --prefix npm-shim
      - name: Pack the exact npm artifact
        working-directory: npm-shim
        run: npm pack --ignore-scripts
      - name: Sign the npm artifact provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: npm-shim/fatelabs-estelle-*.tgz
      - name: Publish the native compatibility launcher
        working-directory: npm-shim
        run: npm publish --provenance --access public

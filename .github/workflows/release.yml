# Publish @fatelabs/estelle to npm with provenance.
#
# Human-gated: fires only when a maintainer publishes a GitHub release — never on push or a schedule.
# `--provenance` needs `id-token: write` (OIDC) and a PUBLIC repo; it emits a sigstore attestation linking
# the published bytes to this commit, so anyone installing can verify that what runs on their machine is
# what they can read here. Fail closed: no token, no publish — there is no unsigned fallback.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Test, then publish with provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs a recent npm; the version bundled with the runner's Node predates
      # it, which surfaces as a bare `404 Not Found - PUT` on a package that plainly exists.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      # Trusted publishing (OIDC) needs a recent npm; the version bundled with the runner's Node predates
      # it, which surfaces as a bare `404 Not Found - PUT` on a package that plainly exists.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - name: Install (lockfile-exact)
        run: npm ci

      - name: Test
        run: npm test

      # Auth is npm TRUSTED PUBLISHING (OIDC) — no token. npm now restricts tokens from bypassing 2FA for
      # direct publishing, so a token in CI fails with EOTP no matter how it is scoped. OIDC has nothing to
      # steal, nothing to expire, and nothing to prompt. Configure the trusted publisher on npmjs.com for
      # @fatelabs/estelle: repository uqeu/estelle-cli, workflow release.yml.
      - name: Publish
        run: npm publish --provenance --access public

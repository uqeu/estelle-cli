name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - name: NAME THE TEST — unbuffered writeSync, so a kill cannot eat the evidence
        run: |
          cat > /tmp/probe.js <<'JS'
          const fs = require("fs");
          const say = (s) => fs.writeSync(1, s + "\n");   // SYNC: survives SIGTERM, unlike stdout.write
          const Module = require("module");
          const orig = Module._load;
          const cases = [];
          Module._load = function (req, ...rest) {
            if (req === "node:test" || req === "test") {
              const t = (name, fn) => { cases.push([name, fn]); };
              t.test = t; t.describe = () => {}; t.it = t; t.before = () => {}; t.after = () => {};
              return t;
            }
            return orig.call(this, req, ...rest);
          };
          require("/home/runner/work/estelle-cli/estelle-cli/test/distill.test.js");
          Module._load = orig;
          say("REGISTERED " + cases.length);
          let i = 0;
          for (const [name, fn] of cases) {
            say("[" + (++i) + "/13] START  " + name);
            const t0 = Date.now();
            try { fn(); } catch (e) { say("        THREW  " + String(e.message).split("\n")[0]); }
            say("        DONE   " + (Date.now() - t0) + "ms");
          }
          say("ALL 13 COMPLETED");
          JS
          timeout 100 node /tmp/probe.js; echo "### probe exit=$? (124 = hung; the last START names it)"
      - name: same probe, but with HOME pointed at a scratch dir
        if: always()
        run: |
          mkdir -p /tmp/fakehome
          HOME=/tmp/fakehome timeout 100 node /tmp/probe.js 2>&1 | tail -8
          echo "### exit=$?"

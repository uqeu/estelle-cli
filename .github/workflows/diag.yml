name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - name: THE PROOF — full suite on Linux, must be 286/0/0 with distill in single-digit ms
        run: |
          time npm test 2>&1 | tail -12
      - name: narrow WHICH /proc call blocked (for the errata; not on any customer path)
        if: always()
        run: |
          echo "--- mkdirSync recursive under /proc ---"
          timeout 25 node -e 'const t=Date.now();try{require("fs").mkdirSync("/proc/x/y",{recursive:true,mode:0o700})}catch(e){console.log("threw",e.code)};console.log("mkdir ms",Date.now()-t)'; echo "exit=$?"
          echo "--- readdirSync under /proc ---"
          timeout 25 node -e 'const t=Date.now();try{require("fs").readdirSync("/proc/x")}catch(e){console.log("threw",e.code)};console.log("readdir ms",Date.now()-t)'; echo "exit=$?"
          echo "--- the exact original spill() call ---"
          timeout 25 node -e 'const t=Date.now();const d=require("./bin/distill.js");console.log("spill ->",JSON.stringify(d.spill("body","/proc/definitely/not/writable/estelle")),Date.now()-t+"ms")'; echo "exit=$?"

name: public-five-worker-receipt

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing public release tag to probe
        required: true
        default: v0.2.16

permissions:
  contents: read

concurrency:
  group: public-five-worker-receipt-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require an exact public release
        env:
          ESTELLE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' <<<"$ESTELLE_VERSION"
          gh release view "$ESTELLE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
      - name: Install from the exact public URL
        env:
          ESTELLE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${ESTELLE_VERSION}/install.sh" | sh
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
      - name: Clone the real-size public repository
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/Shubhamsaboo/awesome-llm-apps.git \
            "${RUNNER_TEMP}/awesome-llm-apps"
          test "$(git -C "${RUNNER_TEMP}/awesome-llm-apps" ls-files '*.py' | wc -l)" -gt 500
      - name: Drive five installed-binary sessions
        id: five_workers
        continue-on-error: true
        env:
          ESTELLE_API_KEY: ${{ secrets.ESTELLE_RECEIPT_API_KEY }}
          ESTELLE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -n "${ESTELLE_API_KEY:-}" || {
            echo "five-worker receipt: ESTELLE_RECEIPT_API_KEY is absent on ${GITHUB_REPOSITORY}" >&2
            exit 1
          }
          test "$(command -v estelle)" = "${HOME}/.local/bin/estelle"
          python3 scripts/probe-public-five-worker.py \
            --binary "${HOME}/.local/bin/estelle" \
            --repo-dir "${RUNNER_TEMP}/awesome-llm-apps" \
            --repo Shubhamsaboo/awesome-llm-apps \
            --expected-version "$ESTELLE_VERSION" \
            --output "${RUNNER_TEMP}/public-five-worker-receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: public-five-worker-receipt-${{ inputs.version }}
          path: ${{ runner.temp }}/public-five-worker-receipt.json
          if-no-files-found: error
      - name: Fail closed after preserving the receipt
        if: always() && steps.five_workers.outcome == 'failure'
        run: |
          echo "five-worker receipt: installed-binary proof failed; inspect the uploaded receipt" >&2
          exit 1

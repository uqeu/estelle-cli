<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estelle CLI design book — prototype</title>
  <style>
    :root {
      --cream: #E9E6DC;
      --ink: #1F1C17;
      --red: #C52416;
      --paper: #F5F2E9;
      --muted: #716D64;
      --line: color-mix(in srgb, var(--ink) 22%, transparent);
      --ghost: color-mix(in srgb, var(--cream) 10%, transparent);
      --shadow: 0 24px 70px rgb(0 0 0 / 0.34);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--ink); color: var(--cream); }
    button, input { font: inherit; }
    button { color: inherit; }
    .prototype-ribbon {
      position: fixed; top: 0; right: 0; z-index: 20; padding: 8px 14px;
      background: var(--red); color: var(--cream); font-size: 11px; letter-spacing: .12em;
      text-transform: uppercase;
    }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 260px 1fr; }
    .rail {
      position: sticky; top: 0; height: 100vh; overflow: auto; padding: 30px 18px 110px;
      border-right: 1px solid var(--line); background: #181613;
    }
    .brand { margin: 0 10px 8px; font-size: 18px; letter-spacing: -.04em; }
    .brief { margin: 0 10px 24px; color: #A7A197; font-size: 11px; line-height: 1.5; }
    .surface-button {
      width: 100%; display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start;
      padding: 9px 10px; border: 0; border-left: 2px solid transparent; background: transparent;
      text-align: left; cursor: pointer; color: #AAA49B;
    }
    .surface-button:hover { color: var(--cream); background: var(--ghost); }
    .surface-button.active { color: var(--cream); border-left-color: var(--red); background: var(--ghost); }
    .surface-button .n { color: var(--red); font-size: 11px; padding-top: 2px; }
    main { min-width: 0; padding: 56px clamp(24px, 5vw, 78px) 130px; }
    .page-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .eyebrow { margin: 0 0 8px; color: #A7A197; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font: 600 clamp(30px, 5vw, 66px)/.96 ui-serif, Georgia, serif; letter-spacing: -.055em; }
    .requirements { max-width: 420px; color: #AAA49B; font-size: 12px; line-height: 1.6; }
    .canvas { min-height: 650px; }
    .evidence {
      display: inline-flex; gap: 8px; align-items: center; margin-bottom: 14px; padding: 6px 9px;
      border: 1px solid var(--line); color: #B8B1A7; font-size: 10px; text-transform: uppercase;
      letter-spacing: .09em;
    }
    .evidence::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
    .terminal { border: 1px solid var(--line); background: #12110F; box-shadow: var(--shadow); }
    .terminal-top { display: flex; justify-content: space-between; padding: 10px 13px; border-bottom: 1px solid var(--line); color: #8F8980; font-size: 11px; }
    .screen { padding: clamp(18px, 3vw, 38px); min-height: 480px; }
    .section-label { color: #8F8980; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .title { margin: 6px 0 20px; font-size: clamp(22px, 3vw, 38px); letter-spacing: -.04em; }
    .rows { display: grid; gap: 8px; }
    .row { display: grid; grid-template-columns: minmax(105px, .42fr) 1fr auto; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .row .key { color: #9B958C; }
    .row .value { color: var(--cream); overflow-wrap: anywhere; }
    .row .state { color: #8F8980; font-size: 11px; }
    .row.alert .key, .row.alert .state { color: #F06D61; }
    .failure { margin-top: 22px; padding: 14px 16px; border-left: 3px solid var(--red); background: rgb(197 36 22 / .10); }
    .failure strong { display: block; margin-bottom: 5px; color: #F08A80; }
    .failure span { color: #B8B1A7; font-size: 12px; line-height: 1.55; }
    .composer {
      margin-top: 28px; padding: 13px 15px 10px; border: 1px solid #625D55; background: #191714;
      box-shadow: inset 3px 0 var(--red);
    }
    .composer input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--cream); }
    .composer-foot { display: flex; justify-content: space-between; margin-top: 10px; color: #777168; font-size: 10px; }
    .deck { display: grid; grid-template-columns: minmax(180px, .42fr) 1fr; gap: 14px; }
    .deck-nav { border: 1px solid var(--line); background: #171512; }
    .deck-nav button { display: block; width: 100%; padding: 14px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; }
    .deck-nav button:first-child { background: var(--cream); color: var(--ink); }
    .deck-nav small { display: block; margin-top: 4px; color: #777168; }
    .deck-nav button:first-child small { color: #625D55; }
    .ledger { background: var(--paper); color: var(--ink); border-top: 7px solid var(--red); box-shadow: var(--shadow); }
    .ledger .terminal-top { color: #6B655D; border-color: rgb(31 28 23 / .18); }
    .ledger .screen { min-height: 520px; }
    .ledger .row { grid-template-columns: 44px minmax(120px, .45fr) 1fr; border-color: rgb(31 28 23 / .16); }
    .ledger .row .key { color: #635E56; }
    .ledger .row .state { color: var(--red); order: -1; }
    .ledger .failure { background: rgb(197 36 22 / .07); }
    .ledger .failure span { color: #655F57; }
    .ledger .section-label { color: var(--red); }
    .ledger .composer { background: transparent; border-color: rgb(31 28 23 / .36); }
    .ledger .composer input { color: var(--ink); }
    .focus-wrap { min-height: 650px; display: grid; place-items: center; position: relative; overflow: hidden; }
    .focus-wrap::before { content: ""; position: absolute; inset: 11% 5%; border: 1px solid var(--line); transform: rotate(-1.2deg); }
    .focus { position: relative; width: min(780px, 92%); border: 0; border-top: 1px solid #777168; border-bottom: 1px solid #777168; background: transparent; box-shadow: none; }
    .focus .screen { min-height: auto; padding: 48px 20px; }
    .focus .rows { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
    .focus .row { grid-template-columns: 1fr; gap: 5px; }
    .focus .row .state { grid-row: 1; color: var(--red); }
    .progress-track { display: flex; gap: 4px; margin: 22px 0; }
    .progress-track span { flex: 1; min-width: 20px; height: 7px; background: #3D3933; }
    .progress-track span.done { background: var(--cream); }
    .progress-track span.active { background: var(--red); }
    .story { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 18px 0; }
    .story div { padding: 13px; border: 1px solid var(--line); min-height: 82px; }
    .story b { display: block; margin-bottom: 8px; color: var(--red); font-size: 11px; }
    .mermaid { margin: 20px 0; padding: 20px; background: var(--paper); color: var(--ink); text-align: center; }
    .variant-switcher {
      position: fixed; left: 50%; bottom: 22px; z-index: 30; transform: translateX(-50%);
      display: grid; grid-template-columns: 42px minmax(210px, auto) 42px; align-items: center;
      border: 1px solid #7A746B; border-radius: 999px; background: #0E0D0B; box-shadow: 0 16px 55px rgb(0 0 0 / .55);
    }
    .variant-switcher button { height: 42px; border: 0; background: transparent; cursor: pointer; }
    .variant-switcher button:hover { color: #F08A80; }
    .variant-name { padding: 0 12px; text-align: center; color: #C8C2B8; font-size: 11px; }
    @media (max-width: 840px) {
      .shell { grid-template-columns: 1fr; }
      .rail { position: static; height: auto; display: flex; overflow-x: auto; padding: 14px; border-right: 0; border-bottom: 1px solid var(--line); }
      .brand, .brief { display: none; }
      .surface-button { flex: 0 0 170px; }
      main { padding-top: 32px; }
      .page-head { display: block; }
      .requirements { margin-top: 18px; }
      .deck { grid-template-columns: 1fr; }
      .deck-nav { display: none; }
      .story { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="prototype-ribbon">Prototype · do not ship</div>
  <div class="shell">
    <aside class="rail">
      <h2 class="brand">ESTELLE / DESIGN BOOK</h2>
      <p class="brief">Fifteen customer surfaces. Three structural directions each. Facts are recorder-backed or explicitly absent.</p>
      <nav id="surfaces" aria-label="Design surfaces"></nav>
    </aside>
    <main>
      <header class="page-head">
        <div>
          <p class="eyebrow" id="eyebrow"></p>
          <h1 id="heading"></h1>
        </div>
        <p class="requirements" id="requirements"></p>
      </header>
      <section class="canvas" id="canvas" aria-live="polite"></section>
    </main>
  </div>
  <div class="variant-switcher" id="switcher" aria-label="Prototype variant switcher">
    <button id="previous" aria-label="Previous variant">←</button>
    <div class="variant-name" id="variant-name"></div>
    <button id="next" aria-label="Next variant">→</button>
  </div>
  <script type="module">
    // Three variants of every required CLI surface, switchable with ?surface=&variant=.
    // PROTOTYPE: read-only, no persistence, no product mutations.
    const variants = [
      { key: 'A', name: 'Command deck' },
      { key: 'B', name: 'Evidence ledger' },
      { key: 'C', name: 'Focused terminal' },
    ];

    const surfaces = [
      { id:'composer', name:'Composer / bottom pane', needs:'Input, mode, routing, slash popup, mentions, and the ! shell state.', evidence:'Current command catalog and read_only default', rows:[['draft','Ask Estelle','editable'],['mode','read_only','server ceiling'],['route','not returned yet','omitted'],['mentions','@ files · $ skills','available'],['shell','!command','30 s default']], failure:'Provider routing is unavailable until identity and model payment are resolved.' },
      { id:'transcript', name:'Transcript / history cell', needs:'User, Estelle, tool, shell, and error must have unmistakable provenance.', evidence:'Existing typed TranscriptEntry variants', rows:[['USER','/doctor','input'],['ESTELLE','The local endpoint did not reply within 5s.','model'],['TOOL','GET /models','bounded probe'],['SHELL','working tree clean','machine output'],['ERROR','Provider unreachable','failure']], failure:'Shell output must never inherit the Estelle/model treatment.' },
      { id:'work', name:'Live /work progress', needs:'Ordered phases and elapsed time; never an invented ETA or percentage.', evidence:'Recorder read-back: revision 2; scope, recall', rows:[['scope','recorded','complete'],['recall','recorded','current'],['conventions','not emitted','waiting'],['prompt','not emitted','waiting'],['implement','not emitted','waiting'],['gate','not emitted','waiting']], failure:'If the job stops returning newer revisions, say “no newer progress returned”; do not keep implying movement.', progress:true },
      { id:'gate', name:'Gate verdict', needs:'Merge/refuse, blockers, and cited lines. This is the product.', evidence:'Local refusal path with no measured diff', rows:[['verdict','REFUSE','fail closed'],['subject','staged diff','not measured'],['blocker','No staged diff is available.','local'],['next','Stage the intended change, then run /gate.','action']], failure:'A missing diff is not a clean diff and cannot produce a merge verdict.' },
      { id:'plan', name:'/plan', needs:'The proposed sequence, ownership, limits, and the negative control before work runs.', evidence:'Command contract; no plan run attached', rows:[['objective','not returned','absent'],['steps','not returned','absent'],['files','not returned','absent'],['negative control','not returned','required']], failure:'No plan was run for this preview; empty plan fields remain absent.' },
      { id:'loop', name:'Self-correcting loop', needs:'/diff → /propose → /apply → /undo as one reversible visual story.', evidence:'Existing explicit command boundaries', rows:[['diff','read local working tree','not run'],['propose','prepare reviewable change','not run'],['apply','explicit write','not run'],['undo','reverse last /apply','available']], failure:'No change is styled as applied until the working tree is read back.', story:true },
      { id:'prod', name:'/prod monitor', needs:'Production topology in Mermaid; unknown external state must remain unknown.', evidence:'Known route topology only; health not fetched', rows:[['source','main','watched ref'],['deploy','not fetched','unknown'],['/health','not fetched','unknown'],['/mcp','not fetched','unknown']], failure:'No production request was made by this prototype.', mermaid:true },
      { id:'resume', name:'Resume picker / sessions', needs:'Multiple sessions and windows without inventing session state.', evidence:'Current local session id only', rows:[['main','current terminal','known'],['catalogue','not returned','unknown'],['other windows','not measured','unknown'],['ranking','frecency not built','absent']], failure:'A missing catalogue is not an empty catalogue.' },
      { id:'login', name:'Login, two-stage', needs:'Identity first, then one of four model-payment paths.', evidence:'Current picker contract', rows:[['1 · identity','Connect Estelle','required'],['2 · payment','Claude subscription','option'],['2 · payment','Provider API key','option'],['2 · payment','Local model','option'],['2 · payment','GitHub Copilot','option']], failure:'ChatGPT acquisition is unavailable because the inherited OAuth client id is not Estelle-owned.' },
      { id:'doctor', name:'/doctor', needs:'Configured providers can fail with distinct remedies.', evidence:'Binding enum and bounded /models probe', rows:[['bound','data array returned','pass'],['refused','401 or 403','credential remedy'],['endpoint error','other non-2xx','server remedy'],['invalid response','2xx without data array','contract remedy'],['unreachable','no reply within 5s','endpoint remedy']], failure:'Presence alone is not capability; a configured file cannot make this screen green.' },
      { id:'sweep', name:'/sweep progress', needs:'Measured files, bytes, throughput, and honest ETA only when derivable.', evidence:'Progress contract; no sweep run attached', rows:[['state','not started','idle'],['files','not measured','absent'],['bytes','not measured','absent'],['throughput','not measured','absent'],['ETA','not available','honest']], failure:'Never derive an ETA from a constant or render 0% as evidence that a sweep began.', progress:true },
      { id:'memory', name:'/memory + /recall', needs:'What Estelle knows, where it came from, and whether the repo was swept.', evidence:'Empty-state contract', rows:[['repository','current working tree','local'],['sweep','not established','unknown'],['cards','not returned','unknown'],['provenance','not returned','unknown'],['recall','unavailable until memory is read','blocked']], failure:'No returned cards is different from a proven empty memory.' },
      { id:'boot', name:'Boot / splash', needs:'Keep the spider lily and yield immediately to the first interaction.', evidence:'Existing BootScene contract', rows:[['mark','spider lily','kept'],['motion','skippable','bounded'],['reduced motion','ESTELLE_REDUCED_MOTION','supported'],['first input','skips boot','not consumed']], failure:'Boot must never delay or eat the user’s first command.' },
      { id:'status', name:'Status bar', needs:'Composable model, tier, context, cost, and routing segments.', evidence:'Server-observed values only', rows:[['model','not returned','omit'],['tier','not returned','omit'],['context','not measured','omit'],['cost','not metered','omit'],['routing','not returned','omit']], failure:'Unavailable segments disappear independently; placeholders never become facts.' },
      { id:'errors', name:'Error / failure states', needs:'What failed, whose surface failed, and the next executable action.', evidence:'Failure-screen contract', rows:[['what','Provider endpoint did not reply','fact'],['where','local model binding','owner'],['next','Check the endpoint, then run /doctor.','action'],['secret values','never rendered','boundary'],['retry','user initiated','consent']], failure:'Offline, cancelled, refused, and malformed are separate states with opposite remedies.' },
    ];

    const params = new URLSearchParams(location.search);
    let surfaceIndex = Math.max(0, surfaces.findIndex(s => s.id === params.get('surface')));
    let variantIndex = Math.max(0, variants.findIndex(v => v.key === (params.get('variant') || 'A').toUpperCase()));

    const escapeHtml = value => String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const rows = surface => `<div class="rows">${surface.rows.map(([key,value,state]) => `<div class="row ${state.includes('fail') ? 'alert' : ''}"><span class="key">${escapeHtml(key)}</span><span class="value">${escapeHtml(value)}</span><span class="state">${escapeHtml(state)}</span></div>`).join('')}</div>`;
    const progress = surface => surface.progress ? `<div class="progress-track" aria-label="Ordered progress, not a percentage">${surface.rows.map((_, i) => `<span class="${i === 0 ? 'done' : i === 1 && surface.id === 'work' ? 'active' : ''}"></span>`).join('')}</div>` : '';
    const story = surface => surface.story ? `<div class="story">${surface.rows.map(([key,value,state]) => `<div><b>${escapeHtml(key)}</b>${escapeHtml(value)}<br><small>${escapeHtml(state)}</small></div>`).join('')}</div>` : '';
    const diagram = surface => surface.mermaid ? `<pre class="mermaid">flowchart LR
  main[main] --> railway[Railway deploy]
  railway --> health[GET /health]
  railway --> mcp[POST /mcp initialize]
  health -. not fetched .-> unknown[unknown]
  mcp -. not fetched .-> unknown</pre>` : '';
    const failure = surface => `<div class="failure"><strong>Failure state</strong><span>${escapeHtml(surface.failure)}</span></div>`;
    const composer = () => `<div class="composer"><input aria-label="Prototype composer" placeholder="Ask Estelle"><div class="composer-foot"><span>read_only · route not returned</span><span>Enter send · ! shell</span></div></div>`;

    function body(surface) { return `${progress(surface)}${story(surface)}${diagram(surface)}${rows(surface)}${failure(surface)}${composer()}`; }
    function variantA(surface) { return `<div class="deck"><div class="deck-nav"><button>Current surface<small>${escapeHtml(surface.name)}</small></button><button>Evidence<small>${escapeHtml(surface.evidence)}</small></button><button>Failure<small>Designed, not incidental</small></button></div><article class="terminal"><div class="terminal-top"><span>ESTELLE / ${escapeHtml(surface.id)}</span><span>variant A</span></div><div class="screen"><span class="section-label">Command deck</span><h2 class="title">${escapeHtml(surface.name)}</h2>${body(surface)}</div></article></div>`; }
    function variantB(surface) { return `<article class="terminal ledger"><div class="terminal-top"><span>EVIDENCE LEDGER · ${escapeHtml(surface.id)}</span><span>read-back first</span></div><div class="screen"><span class="section-label">Receipt view</span><h2 class="title">${escapeHtml(surface.name)}</h2>${body(surface)}</div></article>`; }
    function variantC(surface) { return `<div class="focus-wrap"><article class="terminal focus"><div class="terminal-top"><span>${escapeHtml(surface.id)}</span><span>quiet focus</span></div><div class="screen"><span class="section-label">One decision at a time</span><h2 class="title">${escapeHtml(surface.name)}</h2>${body(surface)}</div></article></div>`; }

    function updateUrl() {
      const next = new URL(location.href);
      next.searchParams.set('surface', surfaces[surfaceIndex].id);
      next.searchParams.set('variant', variants[variantIndex].key);
      history.replaceState(null, '', next);
    }
    function renderNav() {
      document.querySelector('#surfaces').innerHTML = surfaces.map((surface, index) => `<button class="surface-button ${index === surfaceIndex ? 'active' : ''}" data-index="${index}"><span class="n">${String(index + 1).padStart(2, '0')}</span><span>${escapeHtml(surface.name)}</span></button>`).join('');
      document.querySelectorAll('.surface-button').forEach(button => button.addEventListener('click', () => { surfaceIndex = Number(button.dataset.index); updateUrl(); render(); }));
    }
    function render() {
      const surface = surfaces[surfaceIndex];
      const variant = variants[variantIndex];
      document.querySelector('#eyebrow').textContent = `${String(surfaceIndex + 1).padStart(2, '0')} / 15 · ${variant.key} — ${variant.name}`;
      document.querySelector('#heading').textContent = surface.name;
      document.querySelector('#requirements').textContent = surface.needs;
      document.querySelector('#variant-name').textContent = `${variant.key} — ${variant.name}`;
      document.querySelector('#canvas').innerHTML = `<div class="evidence">${escapeHtml(surface.evidence)}</div>${[variantA, variantB, variantC][variantIndex](surface)}`;
      renderNav();
    }
    function cycle(delta) { variantIndex = (variantIndex + delta + variants.length) % variants.length; updateUrl(); render(); }
    document.querySelector('#previous').addEventListener('click', () => cycle(-1));
    document.querySelector('#next').addEventListener('click', () => cycle(1));
    addEventListener('keydown', event => {
      if (event.target.matches('input, textarea, [contenteditable]')) return;
      if (event.key === 'ArrowLeft') cycle(-1);
      if (event.key === 'ArrowRight') cycle(1);
      if (event.key === 'ArrowUp') { surfaceIndex = (surfaceIndex - 1 + surfaces.length) % surfaces.length; updateUrl(); render(); }
      if (event.key === 'ArrowDown') { surfaceIndex = (surfaceIndex + 1) % surfaces.length; updateUrl(); render(); }
    });
    if (location.hostname && !['localhost', '127.0.0.1'].includes(location.hostname)) document.querySelector('#switcher').hidden = true;
    render();
  </script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/+esm';
    mermaid.initialize({ startOnLoad: true, theme: 'neutral', securityLevel: 'strict' });
  </script>
</body>
</html>

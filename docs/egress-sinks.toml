[[sink]]
id = "hook-stream"
reachability = "released"
source_file = "tui/src/hook_stream_run.rs"
source_symbol = "impl StreamSink for ClientSink"
trigger = "automatic after explicit install-hooks: UserPromptSubmit, PostToolUse, Stop and SessionEnd on Claude Code; on Codex (synchronous hooks) Stop, plus UserPromptSubmit and PostToolUse since 0.4.7, each mid-turn run bounded per session by a local stamp written before the request (tui/src/hook_stream_codex.rs `codex_claim_run`). Also on explicit `estelle sessions import` (tui/src/sessions_import.rs), which sends transcripts already on disk through the same runner, mapping and redaction; `--dry-run` sends nothing"
confirmation = "no per-event confirmation"
destination = "https://api.fatelabs.ca/session/events"
data = "the host session transcript (Claude Code JSONL and its subagent transcripts, or the Codex rollout): prompts, replies, recorded thinking, tool calls and results, edit diffs, token usage and Estelle's own injected prompt context; plus, from the hook's git repository (local git subprocesses, no network): working-tree diffs against HEAD of files the session's own tool calls named and changed since it began (80 files, 120,000 chars each), the session's commits (sha, author name, subject, file names) and the tracked path list (20,000 paths, names only, no contents); secret-shaped values redacted (diffs included), each text field capped at 20,000 characters, NUL stripped"
disposition = "keep; this is the feature (the customer's own session mirrored into their dashboard); a per-install opt-out is not yet built"

